# Postgres for the feedback kiosk. Start it with `docker compose up -d` (OrbStack or Docker Desktop).
# The data lives in a Docker volume, not in this (iCloud-synced) folder.
name: gesture-feedback

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
