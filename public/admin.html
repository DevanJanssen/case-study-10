<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin">
  <header class="admin-head">
    <div>
      <h1>Feedback admin</h1>
      <p class="sub">Manage the questions on the <a href="/" target="_blank">kiosk</a> and see every answer.</p>
    </div>
    <button id="logoutBtn" class="secondary small" hidden>Sign out</button>
  </header>

  <section class="card" id="loginCard">
    <h2>Sign in</h2>
    <form id="loginForm" class="row">
      <input type="password" id="password" placeholder="Admin password" autocomplete="current-password" required style="flex:1;min-width:200px">
      <button type="submit">Sign in</button>
    </form>
    <p class="msg" id="loginMsg"></p>
  </section>

  <div id="dashboard" hidden>
    <section class="card">
      <h2>Kiosk variant</h2>
      <div class="variant-switch" id="variantSwitch" role="group" aria-label="Kiosk variant">
        <button type="button" data-variant="thumbs" aria-pressed="false">
          <span class="v-icon">👍👎</span><span class="v-name">Agree / disagree</span><span class="v-count"></span>
        </button>
        <button type="button" data-variant="stars" aria-pressed="false">
          <span class="v-icon">⭐</span><span class="v-name">1–5 stars</span><span class="v-count"></span>
        </button>
        <button type="button" data-variant="fingers" aria-pressed="false">
          <span class="v-icon">✋</span><span class="v-name">1–5 fingers</span><span class="v-count"></span>
        </button>
      </div>
      <p class="msg" id="variantMsg"></p>
    </section>

    <section class="card">
      <h2>Add a question</h2>
      <form id="addForm" class="q-form">
        <textarea id="newText" maxlength="300" placeholder="e.g. The pace of this lesson was right for me." required></textarea>
        <div class="q-form-foot">
          <div id="newVariants"></div>
          <button type="submit">Add question</button>
        </div>
        <p class="msg" id="addMsg"></p>
      </form>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Questions <span class="count" id="questionCount"></span></h2>
        <button id="exportBtn" class="secondary small">Export answers (CSV)</button>
      </div>
      <ul class="questions" id="questionList"></ul>
      <p class="empty" id="emptyMsg" hidden>No questions yet. Add one above.</p>
    </section>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
