<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gesture Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="kiosk" data-mode="thumbs">
  <header class="statement-bar">
    <p class="eyebrow" id="eyebrow">Do you agree?</p>
    <h1 id="statement">Loading statement…</h1>
  </header>

  <main class="stage">
    <div class="camera" id="camera">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>

      <!-- Stars variant: point the index finger at a star to select a rating -->
      <div class="stars" id="stars" aria-label="Rating" hidden>
        <div class="star-row" id="starRow"></div>
        <p class="star-label" id="starLabel">Point at a star</p>
      </div>
      <!-- Fingers variant: hold up 1–5 fingers to give a rating -->
      <div class="stars" id="fingers" aria-label="Rating" hidden>
        <div class="finger-row" id="fingerRow"></div>
        <p class="star-label" id="fingerLabel">Hold up 1 to 5 fingers</p>
      </div>
      <div class="cursor" id="cursor" hidden>
        <svg viewBox="0 0 60 60" aria-hidden="true">
          <circle class="cursor-track" cx="30" cy="30" r="24"></circle>
          <circle class="cursor-fill" id="cursorFill" cx="30" cy="30" r="24"></circle>
        </svg>
        <span class="cursor-count" id="cursorCount"></span>
      </div>

      <!-- Hold-progress ring, shown while a thumb gesture is held -->
      <div class="ring-wrap" id="ringWrap" hidden>
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-track" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ring-label">
          <span class="ring-emoji" id="ringEmoji">👍</span>
          <span class="ring-count" id="ringCount">3</span>
        </div>
      </div>

      <!-- Result card, shown after a vote -->
      <div class="result" id="result" hidden>
        <p class="result-title" id="resultTitle">Agree recorded ✓</p>
        <p class="result-average" id="resultAverage" hidden></p>
        <div class="bars" id="resultBars"></div>
        <p class="result-total" id="resultTotal"></p>
      </div>

      <!-- Loading / error / start overlay -->
      <div class="notice" id="notice">
        <p id="noticeText">Loading hand tracking…</p>
        <button id="startBtn" hidden>Start camera</button>
      </div>
    </div>

    <p class="status" id="status" aria-live="polite">Show 👍 to agree or 👎 to disagree, and hold it for 3 seconds</p>
  </main>

  <footer class="privacy">The camera image is processed on this device only and is never stored or sent.</footer>

  <script type="module" src="kiosk.js"></script>
</body>
</html>
